<title>systemd 服务文件生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  /* 版式:左侧分组表单 / 右侧常驻 unit 文件面板;桌面双栏,手机收成底部抽屉 */
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#eef1f5;
  --fg:#151a21;
  --fg-2:#4d5866;
  --fg-3:#767f8d;
  --border:#dce1e9;
  --border-2:#c2cad6;
  --accent:#0e6f78;
  --accent-fg:#ffffff;
  --accent-soft:#dff0f1;
  --ok:#1c7a4c;
  --ok-soft:#e6f4ec;
  --warn:#8a5604;
  --warn-soft:#fdf2df;
  --err:#ad2820;
  --err-soft:#fdecea;
  --code-bg:#0e141b;
  --code-fg:#dbe3ec;
  --code-key:#79cfd6;
  --code-sec:#eda65e;
  --code-cm:#6d7b8c;
  --code-gutter:#3d4855;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -16px rgba(16,24,40,.22);
  --font-display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1218;
    --surface:#141b23;
    --surface-2:#1b242e;
    --fg:#e7edf4;
    --fg-2:#a3aebd;
    --fg-3:#8b96a4;
    --border:#25303c;
    --border-2:#35424f;
    --accent:#5fd0c8;
    --accent-fg:#062b2c;
    --accent-soft:#153230;
    --ok:#5cc98d;
    --ok-soft:#13301f;
    --warn:#e0ab5a;
    --warn-soft:#33280f;
    --err:#f08a80;
    --err-soft:#3a1c19;
    --code-bg:#080c11;
    --code-fg:#dbe3ec;
    --code-key:#7fd8de;
    --code-sec:#f0ab63;
    --code-cm:#6f7d8d;
    --code-gutter:#38424e;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1218;
  --surface:#141b23;
  --surface-2:#1b242e;
  --fg:#e7edf4;
  --fg-2:#a3aebd;
  --fg-3:#8b96a4;
  --border:#25303c;
  --border-2:#35424f;
  --accent:#5fd0c8;
  --accent-fg:#062b2c;
  --accent-soft:#153230;
  --ok:#5cc98d;
  --ok-soft:#13301f;
  --warn:#e0ab5a;
  --warn-soft:#33280f;
  --err:#f08a80;
  --err-soft:#3a1c19;
  --code-bg:#080c11;
  --code-fg:#dbe3ec;
  --code-key:#7fd8de;
  --code-sec:#f0ab63;
  --code-cm:#6f7d8d;
  --code-gutter:#38424e;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.55;
  padding-inline:18px;
  padding-block:0 40px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

.page-head{
  max-width:1500px;margin:0 auto;
  padding-block:30px 22px;
  display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-end;justify-content:space-between;
}
.brand{display:flex;flex-direction:column;gap:7px;min-width:0}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
h1{font-size:clamp(23px,3.4vw,31px);font-weight:700;letter-spacing:-.018em;line-height:1.12}
.sub{color:var(--fg-2);max-width:60ch;font-size:14px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;
  border:1px solid var(--border-2);background:var(--surface);color:var(--fg);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background-color .14s,border-color .14s,color .14s;
}
.btn:hover{background:var(--surface-2);border-color:var(--fg-3)}
.btn svg{width:14px;height:14px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2);padding-inline:10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:7px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.seg{
  display:inline-flex;align-items:center;gap:2px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:2px;
}
.seg>button{
  border:none;background:transparent;border-radius:7px;
  padding:5px 9px;font-size:12.5px;font-weight:500;color:var(--fg-2);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:background-color .14s,color .14s;
}
.seg>button:hover{color:var(--fg)}
.seg>button[aria-pressed="true"]{
  background:var(--surface);color:var(--fg);
  box-shadow:0 1px 2px rgba(16,24,40,.14);
}
.seg>button svg{width:14px;height:14px;flex:none}
.seg .seg-label{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-3);padding-inline:5px 3px;font-family:var(--font-body);
}

.layout{
  max-width:1500px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);
  gap:26px;align-items:start;
}
@media (max-width:940px){ .layout{grid-template-columns:minmax(0,1fr)} }

/* ---------- 表单 ---------- */
form{display:flex;flex-direction:column;gap:13px;min-width:0}
.group{
  background:var(--surface);border:1px solid var(--border);border-radius:11px;
  overflow:hidden;
}
.group>summary{
  list-style:none;cursor:pointer;padding:13px 16px;
  display:flex;align-items:center;gap:11px;
  font-family:var(--font-display);font-weight:600;font-size:14.5px;
  letter-spacing:-.008em;
}
.group>summary::-webkit-details-marker{display:none}
.group>summary:hover{background:var(--surface-2)}
.group[open]>summary{border-bottom:1px solid var(--border)}
.chev{
  width:15px;height:15px;flex:none;color:var(--fg-3);
  transition:transform .18s ease;
}
.group[open] .chev{transform:rotate(90deg)}
.g-tag{
  font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--fg-3);
  letter-spacing:.02em;
}
.g-count{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:500;
  color:var(--fg-3);background:var(--surface-2);border:1px solid var(--border);
  padding:2px 7px;border-radius:999px;
}
.g-count[data-on="1"]{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.group-body{padding:16px}
.g-desc{color:var(--fg-2);font-size:13px;margin:0 0 14px}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:600px){ .fields{grid-template-columns:minmax(0,1fr)} }
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;
  color:var(--fg);letter-spacing:-.01em;
}
.field>label .zh{
  font-family:var(--font-body);font-weight:400;color:var(--fg-3);
  font-size:12px;margin-left:6px;letter-spacing:0;
}
.hint{font-size:12px;color:var(--fg-3);line-height:1.45}
.hint code{font-family:var(--font-mono);font-size:11.5px}

input[type=text],textarea,select{
  width:100%;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-family:var(--font-mono);font-size:13px;
  transition:border-color .14s,background-color .14s;
}
input[type=text]::placeholder,textarea::placeholder{color:var(--fg-3);opacity:.72}
input[type=text]:hover,textarea:hover,select:hover{border-color:var(--border-2)}
input[type=text]:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-soft);
}
textarea{resize:vertical;min-height:76px;line-height:1.6}
.select-wrap{position:relative}
.select-wrap svg{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--fg-3);pointer-events:none;
}
select{appearance:none;padding-right:30px;cursor:pointer}

.check{display:flex;align-items:flex-start;gap:9px;min-width:0}
.check input[type=checkbox]{
  accent-color:var(--accent);width:16px;height:16px;margin:2px 0 0;flex:none;
  cursor:pointer;
}
.check .cl{display:flex;flex-direction:column;gap:3px;min-width:0}
.check .cl b{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;letter-spacing:-.01em;
}
.subhead{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;
  margin-top:5px;font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--fg-3);
  font-family:var(--font-body);
}
.subhead::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- 输出面板 ---------- */
.output{
  background:var(--surface);border:1px solid var(--border);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;
  position:sticky;top:18px;max-height:calc(100dvh - 36px);
}
.out-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 13px;border-bottom:1px solid var(--border);
  background:var(--surface);
}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}
.dot[data-s="ok"]{background:var(--ok)}
.dot[data-s="warn"]{background:var(--warn)}
.dot[data-s="err"]{background:var(--err)}
.status{font-size:12.5px;color:var(--fg-2);font-weight:500}
.tabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:8px}
.tab{
  border:none;background:transparent;border-radius:6px;padding:4px 11px;
  font-size:12.5px;font-weight:500;color:var(--fg-2);
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.out-head .spacer{margin-left:auto}
.sheet-toggle{display:none}

.code-wrap{background:var(--code-bg);overflow:auto;flex:1;min-height:0}
.code{
  margin:0;padding:14px 16px 18px;
  font-family:var(--font-mono);font-size:12.5px;line-height:1.68;
  color:var(--code-fg);counter-reset:ln;
  tab-size:2;
}
.code-line{display:grid;grid-template-columns:2.4em minmax(0,1fr);white-space:pre-wrap}
.code-line::before{
  counter-increment:ln;content:counter(ln);
  text-align:right;padding-right:1.1em;
  color:var(--code-gutter);user-select:none;
}
.code-text{overflow-wrap:break-word;min-width:0}
.code-text:empty::before{content:"\200b"}
.c-sec{color:var(--code-sec);font-weight:700}
.c-key{color:var(--code-key)}
.c-val{color:var(--code-fg)}
.c-cm{color:var(--code-cm);font-style:italic}
.c-eq{color:var(--code-gutter)}

.notes{border-top:1px solid var(--border);background:var(--surface);max-height:31%;overflow:auto;flex:none}
.note{
  display:flex;gap:9px;padding:9px 14px;font-size:12.5px;line-height:1.5;
  border-bottom:1px solid var(--border);color:var(--fg-2);
}
.note:last-child{border-bottom:none}
.note .tag{
  flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  height:fit-content;margin-top:1px;
}
.note[data-l="err"]{background:var(--err-soft);color:var(--fg)}
.note[data-l="err"] .tag{background:var(--err);color:var(--surface)}
.note[data-l="warn"]{background:var(--warn-soft);color:var(--fg)}
.note[data-l="warn"] .tag{background:var(--warn);color:var(--surface)}
.note[data-l="note"] .tag{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--border)}
.note b{font-family:var(--font-mono);font-size:12px;font-weight:500}
.note[data-l="err"] b{color:var(--err)}
.note[data-l="warn"] b{color:var(--warn)}
:root[data-theme="dark"] .note[data-l="err"] .tag,
:root[data-theme="dark"] .note[data-l="warn"] .tag{color:var(--code-bg)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .note[data-l="err"] .tag,
  :root:not([data-theme="light"]) .note[data-l="warn"] .tag{color:var(--code-bg)}
}

#backdrop{
  position:fixed;inset:0;background:rgba(8,12,16,.5);z-index:30;
  backdrop-filter:blur(1px);
}

/* ---------- 手机:输出收成底部抽屉 ---------- */
@media (max-width:940px){
  body{padding-block-end:88px}
  .output{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    border-radius:14px 14px 0 0;border-bottom:none;border-left:none;border-right:none;
    max-height:88dvh;
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-shadow:0 -10px 34px -12px rgba(8,12,16,.42);
  }
  .out-head{border-radius:14px 14px 0 0}
  .output[data-open="false"] .code-wrap,
  .output[data-open="false"] .notes{display:none}
  .sheet-toggle{display:inline-flex}
  .out-head .tabs{order:3;width:100%}
}
@media (min-width:941px){ #backdrop{display:none} }

footer{
  max-width:1500px;margin:30px auto 0;padding-top:16px;
  border-top:1px solid var(--border);color:var(--fg-3);font-size:12.5px;
  display:flex;flex-wrap:wrap;gap:6px 18px;
}
footer code{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
<script>
/* 主题偏好必须在首次绘制前生效,否则深色模式下会闪一下白底 */
try{
  var __t = localStorage.getItem("sdtool.theme.v1");
  if(__t === "dark" || __t === "light") document.documentElement.setAttribute("data-theme", __t);
}catch(e){}
</script>

<header class="page-head">
  <div class="brand">
    <span class="eyebrow">/etc/systemd/system</span>
    <h1 id="i18n-title">systemd 服务文件生成器</h1>
    <p class="sub" id="i18n-sub">按 <code>[Unit]</code> / <code>[Service]</code> / <code>[Install]</code> 分段填写，右侧实时生成 unit 文件，附带语法检查提示与部署命令。</p>
  </div>
  <div class="head-actions">
    <div class="seg" id="seg-theme" role="group" aria-label="主题">
      <button type="button" data-theme-set="auto" aria-pressed="true" title="跟随系统">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 21a9 9 0 0 0 0-18" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="theme.auto">自动</span>
      </button>
      <button type="button" data-theme-set="light" aria-pressed="false" title="浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-i18n="theme.light">浅色</span>
      </button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="深色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span data-i18n="theme.dark">深色</span>
      </button>
    </div>
    <div class="seg" id="seg-lang" role="group" aria-label="语言 / Language">
      <button type="button" data-lang-set="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang-set="en" aria-pressed="false">EN</button>
    </div>
    <button class="btn" type="button" id="btn-reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span data-i18n="btn.reset">重置为示例</span>
    </button>
  </div>
</header>

<div class="layout">
  <form id="form" autocomplete="off" novalidate></form>

  <aside class="output" id="output" data-open="false" aria-label="生成结果">
    <div class="out-head">
      <span class="dot" id="status-dot" data-s="ok"></span>
      <span class="status" id="status-text">就绪</span>
      <button class="btn small ghost sheet-toggle" type="button" id="btn-sheet" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 15-6-6-6 6"/></svg>
        <span id="sheet-label">展开</span>
      </button>
      <span class="spacer"></span>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" id="tab-unit" aria-selected="true">unit 文件</button>
        <button class="tab" type="button" role="tab" id="tab-install" aria-selected="false">部署命令</button>
      </div>
      <button class="btn small" type="button" id="btn-copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span id="copy-label">复制</span>
      </button>
    </div>

    <div class="code-wrap" id="pane-unit">
      <pre class="code" id="code-unit"></pre>
    </div>
    <div class="code-wrap" id="pane-install" hidden>
      <pre class="code" id="code-install"></pre>
    </div>

    <div class="notes" id="notes"></div>
  </aside>
</div>

<footer>
  <span id="i18n-foot1">生成的文件放到 <code>/etc/systemd/system/</code>，改完记得 <code>systemctl daemon-reload</code>。</span>
  <span id="i18n-foot2">填写内容只保存在这台浏览器本地。</span>
</footer>

<div id="backdrop" hidden></div>

<script>
(function(){
"use strict";

/* ============ 文案 ============
   SCHEMA 里的字段说明就近写成 {zh,en} 对；界面文字、校验消息、
   生成文件里的注释统一放在 STR 里，按 key 取。 */
var STR = {
  zh:{
    "app.title":"systemd 服务文件生成器",
    "app.sub":'按 <code>[Unit]</code> / <code>[Service]</code> / <code>[Install]</code> 分段填写，右侧实时生成 unit 文件，附带语法检查提示与部署命令。',
    "btn.reset":"重置为示例",
    "tab.unit":"unit 文件",
    "tab.install":"部署命令",
    "copy.idle":"复制",
    "copy.done":"已复制",
    "copy.manual":"请手动复制",
    "sheet.show":"展开",
    "sheet.hide":"收起",
    "theme.auto":"自动",
    "theme.light":"浅色",
    "theme.dark":"深色",
    "theme.group":"主题",
    "lang.group":"语言 / Language",
    "status.ok":"就绪 · 语法检查无异常",
    "status.warn":"可以生成 · {0} 条建议",
    "status.err":"{0} 项错误需要修正",
    "tag.err":"错误",
    "tag.warn":"建议",
    "tag.note":"说明",
    "foot.1":'生成的文件放到 <code>/etc/systemd/system/</code>，改完记得 <code>systemctl daemon-reload</code>。',
    "foot.2":"填写内容只保存在这台浏览器本地。",
    "form.unset":"不设置",

  return t(key).replace(/\{(\d+)\}/g, function(_, i){
    return (args && args[+i] !== undefined) ? args[+i] : "";

/* ============ 读写表单值 ============ */
function readState(){
  var v = {};
  FIELDS.forEach(function(f){
    var node = el("f-"+f.k);
    if(!node) return;
    v[f.k] = (f.type === "check") ? node.checked : node.value;
  });
  return v;
}
function writeState(v, silent){
  FIELDS.forEach(function(f){
    var node = el("f-"+f.k);
    if(!node) return;
    var val = (v[f.k] !== undefined) ? v[f.k] : (DEFAULTS[f.k] !== undefined ? DEFAULTS[f.k] : (f.type==="check"?false:""));
    if(f.type === "check") node.checked = !!val;
    else node.value = val;
  });
  if(!silent) render();
}

/* ============ 小工具 ============ */
function listVal(s){
  return String(s || "").trim().split(/[\s,]+/).filter(Boolean).join(" ");
}
function quoteEnv(s){
  if(!/[\s"'\\]/.test(s)) return s;
  return '"' + s.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';
}
function parseEnv(text){
  var out = [];
  String(text || "").split("\n").forEach(function(raw){
    var line = raw.trim();
    if(!line) return;
    if(line.charAt(0) === "#"){ out.push({comment:line}); return; }
    var i = line.indexOf("=");
    if(i < 1){ out.push({bad:line}); return; }
    out.push({key:line.slice(0,i).trim(), value:line.slice(i+1).trim()});
  });
  return out;
}
function parsePaths(text){
  return String(text || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
}
function safeName(raw){
  var n = String(raw || "").trim().replace(/[^A-Za-z0-9:_.@\-]/g, "-").replace(/^[-.]+/, "");
  return n || "myapp";
}
/* 目录指令只接受「目录名」；填了绝对路径或含非法字符的值不写进输出 */
function dirVal(v, k){
  var parts = String(v[k] || "").trim().split(/\s+/).filter(function(n){
    return n && /^[A-Za-z0-9._-]+$/.test(n);
  });
  return parts.join(" ");
}

/* ============ 生成 unit 文件 ============ */
function buildLines(v){
  var L = [];
  var d  = function(k, val){ L.push({t:"d", k:k, v:String(val)}); };
  var s  = function(x){ L.push({t:"s", k:x}); };
  var b  = function(){ L.push({t:"b"}); };
  var cm = function(x){ L.push({t:"c", k:x}); };
  var set = function(k){ var x = listVal(v[k]); if(x) d(k, x); };

  var name = safeName(v.name);
  cm("/etc/systemd/system/" + name + ".service");
  b();
  s("[Unit]");
  if(v.Description) d("Description", v.Description);
  if(v.Documentation) d("Documentation", listVal(v.Documentation));
  ["Requires","Wants","After","Before","PartOf","Conflicts"].forEach(set);
  set("StartLimitIntervalSec"); set("StartLimitBurst");

  b();
  s("[Service]");
  d("Type", v.Type || "simple");
  set("ExecStartPre"); set("ExecStart"); set("ExecStartPost");
  set("ExecReload"); set("ExecStop"); set("ExecStopPost");
  if(v.RemainAfterExit) d("RemainAfterExit","yes");
  if(v.Restart && v.Restart !== "no") d("Restart", v.Restart);
  set("RestartSec"); set("TimeoutStopSec"); set("WatchdogSec");
  set("WorkingDirectory");
  if(v.DynamicUser){
    d("DynamicUser","yes");
    if(v.Group) d("Group", v.Group);
  } else {
    set("User"); set("Group");
  }
  set("SupplementaryGroups");

  parseEnv(v.Environment).forEach(function(e){
    if(e.comment) cm(e.comment);
    else if(e.bad) cm(fmt("cm.unparsed", [e.bad]));
    else d("Environment", quoteEnv(e.key + "=" + e.value));
  });
  parsePaths(v.EnvironmentFile).forEach(function(p){ d("EnvironmentFile", p); });

  ["StateDirectory","CacheDirectory","LogsDirectory","ConfigurationDirectory","RuntimeDirectory"].forEach(function(k){
    var val = dirVal(v, k);
    if(val) d(k, val);
  });
  set("RuntimeDirectoryPreserve");

  ["NoNewPrivileges","PrivateTmp","PrivateDevices","ProtectSystem","ProtectHome",
   "ProtectKernelTunables","ProtectKernelModules","ProtectKernelLogs","ProtectControlGroups",
   "ProtectClock","ProtectHostname","RestrictAddressFamilies","RestrictNamespaces",
   "LockPersonality","MemoryDenyWriteExecute","RestrictRealtime","RestrictSUIDSGID","RemoveIPC",
   "SystemCallFilter","SystemCallArchitectures","CapabilityBoundingSet","AmbientCapabilities",
   "ReadWritePaths","ReadOnlyPaths","InaccessiblePaths",
   "StandardOutput","StandardError","SyslogIdentifier",
   "LimitNOFILE","MemoryMax","CPUQuota","Nice","OOMScoreAdjust","UMask"
  ].forEach(function(k){
    var f = FIELD_BY_KEY[k];
    if(!f) return;
    if(f.type === "check"){ if(v[k]) d(k, "yes"); }
    else set(k);
  });

  b();
  s("[Install]");
  set("WantedBy"); set("RequiredBy"); set("Also"); set("Alias");
  if(!listVal(v.WantedBy)) cm(t("cm.notWantedBy"));

  while(L.length && L[L.length-1].t === "b") L.pop();
  return L;
}

function linesToText(L){
  return L.map(function(l){
    if(l.t === "s") return l.k;
    if(l.t === "c") return l.k;
    if(l.t === "b") return "";
    return l.k + "=" + l.v;
  }).join("\n") + "\n";
}

function linesToHTML(L){
  return L.map(function(l){
    var inner;
    if(l.t === "s") inner = '<span class="c-sec">'+esc(l.k)+'</span>';
    else if(l.t === "c") inner = '<span class="c-cm">'+esc(l.k)+'</span>';
    else if(l.t === "b") inner = "";
    else inner = '<span class="c-key">'+esc(l.k)+'</span><span class="c-eq">=</span><span class="c-val">'+esc(l.v)+'</span>';
    return '<span class="code-line"><span class="code-text">'+inner+'</span></span>';
  }).join("\n");
}

function installText(name, unitText){
  return [
    t("inst.1"),
    "sudo tee /etc/systemd/system/" + name + ".service >/dev/null <<'EOF'",
    unitText.replace(/\n$/, ""),
    "EOF",
    "",
    t("inst.2"),
    "sudo systemd-analyze verify /etc/systemd/system/" + name + ".service",
    "",
    t("inst.3"),
    "sudo systemctl daemon-reload",
    "sudo systemctl enable --now " + name + ".service",
    "",
    t("inst.4"),
    "systemctl status " + name + ".service",
    "journalctl -u " + name + ".service -f",
    "",
    t("inst.5"),
    "sudo systemctl daemon-reload && sudo systemctl restart " + name + ".service"
  ].join("\n") + "\n";
}

function installHTML(text){
  return text.split("\n").map(function(line){
    var t2 = line.trim();
    var inner = (t2.charAt(0) === "#")
      ? '<span class="c-cm">'+esc(line)+'</span>'
      : esc(line);
    return '<span class="code-line"><span class="code-text">'+inner+'</span></span>';
  }).join("\n");
}

/* ============ 校验 ============ */
var DIR_KEYS = ["StateDirectory","CacheDirectory","LogsDirectory","ConfigurationDirectory","RuntimeDirectory"];

function validate(v){
  var out = [];
  var err  = function(k, msg){ out.push({l:"err",  k:k, msg:msg}); };
  var warn = function(k, msg){ out.push({l:"warn", k:k, msg:msg}); };
  var note = function(k, msg){ out.push({l:"note", k:k, msg:msg}); };

  var name = String(v.name || "").trim();
  if(!name) err("name", t("v.name.empty"));
  else if(!/^[A-Za-z0-9:_.@\\-]+$/.test(name))
    err("name", t("v.name.bad"));
  else if(!/\.(service|socket|timer|target|mount|path)$/.test(name))
    note("name", fmt("v.name.ext", [esc(name)]));

  if(!String(v.ExecStart || "").trim()) err("ExecStart", t("v.exec.empty"));
  else if(v.ExecStart.trim().charAt(0) !== "/")
    err("ExecStart", t("v.exec.rel"));

  if(String(v.ExecStart||"").indexOf("$MAINPID") >= 0)
    warn("ExecStart", t("v.exec.mainpid"));

  if(v.DynamicUser && String(v.User||"").trim())
    warn("DynamicUser", t("v.du.user"));

  if(v.DynamicUser && String(v.Group||"").trim())
    note("DynamicUser", t("v.du.group"));

  DIR_KEYS.forEach(function(k){
    var raw = String(v[k] || "").trim();
    if(!raw) return;
    if(raw.charAt(0) === "/")
      err(k, fmt("v.dir.abs", [esc(raw.split("/").pop()||"")]));
    else {
      var bad = raw.split(/\s+/).filter(function(n){ return !/^[A-Za-z0-9._-]+$/.test(n); });
      if(bad.length) err(k, fmt("v.dir.bad", [esc(bad[0])]));
    }
  });

  if(v.DynamicUser && !String(v.StateDirectory||"").trim() &&
     (String(v.CacheDirectory||"").trim() || String(v.LogsDirectory||"").trim()))
    note("DynamicUser", t("v.du.dirs"));

  if(v.DynamicUser && String(v.WorkingDirectory||"").trim() &&
     DIR_KEYS.every(function(k){ return !String(v[k]||"").trim(); }))
    warn("DynamicUser", t("v.du.workdir"));

  if(v.Restart && v.Restart !== "no" && !String(v.RestartSec||"").trim())
    warn("RestartSec", t("v.restartSec"));

  if(v.Type === "oneshot" && v.Restart && v.Restart !== "no" && v.Restart !== "on-failure")
    warn("Type", fmt("v.oneshot.restart", [esc(v.Restart)]));

  if(v.Type === "oneshot" && !v.RemainAfterExit)
    note("Type", t("v.oneshot.remain"));

  if(v.Type === "forking" && !String(v.ExecStop||"").trim())
    note("Type", t("v.forking.stop"));

  if(v.WatchdogSec && v.Type !== "notify" && v.Type !== "notify-reload")
    warn("WatchdogSec", fmt("v.watchdog", [esc(v.Type)]));

  if(!listVal(v.WantedBy))
    warn("WantedBy", t("v.wantedBy"));

  parseEnv(v.Environment).forEach(function(e){
    if(e.bad) err("Environment", fmt("v.env.bad", [esc(e.bad)]));
  });

  var strict = v.ProtectSystem === "strict";
  if(strict && !String(v.ReadWritePaths||"").trim())
    note("ProtectSystem", t("v.strict.rw"));
  if(strict && !String(v.WorkingDirectory||"").trim() && !v.DynamicUser)
    note("ProtectSystem", t("v.strict.wd"));

  if(v.MemoryDenyWriteExecute)
    warn("MemoryDenyWriteExecute", t("v.mdeny"));

  if(v.NoNewPrivileges && String(v.AmbientCapabilities||"").trim())
    note("AmbientCapabilities", t("v.nnp.ambient"));

  if(!v.DynamicUser && !String(v.User||"").trim())
    warn("User", t("v.user.root"));

  if(String(v.SyslogIdentifier||"").trim() === "" && String(v.name||"").trim())
    note("SyslogIdentifier", fmt("v.syslog", [esc(String(v.name).trim())]));

  return out;
}

/* ============ 渲染 ============ */
var currentTab = "unit";
var lastUnitText = "";
var lastInstallText = "";

function render(){
  var v = readState();
  var lines = buildLines(v);
  var unitText = linesToText(lines);
  var name = safeName(v.name);
  var instText = installText(name, unitText);

  lastUnitText = unitText;
  lastInstallText = instText;

  el("code-unit").innerHTML = linesToHTML(lines);
  el("code-install").innerHTML = installHTML(instText);

  var issues = validate(v);
  var errs  = issues.filter(function(i){ return i.l === "err"; });
  var warns = issues.filter(function(i){ return i.l === "warn"; });

  var dot = el("status-dot"), txt = el("status-text");
  if(errs.length){
    dot.dataset.s = "err";
    txt.textContent = fmt("status.err", [errs.length]);
  } else if(warns.length){
    dot.dataset.s = "warn";
    txt.textContent = fmt("status.warn", [warns.length]);
  } else {
    dot.dataset.s = "ok";
    txt.textContent = t("status.ok");
  }

  var order = {err:0, warn:1, note:2};
  issues.sort(function(a,b){ return order[a.l] - order[b.l]; });
  el("notes").innerHTML = issues.map(function(i){
    return '<div class="note" data-l="'+i.l+'"><span class="tag">'+t("tag."+i.l)+
      '</span><span><b>'+esc(labelOf(i.k))+'</b> · '+i.msg+'</span></div>';
  }).join("");
  el("notes").hidden = issues.length === 0;

  updateCounts(v);
  saveDraft(v);
}

function updateCounts(v){
  SCHEMA.forEach(function(g){
    var n = 0;
    g.fields.forEach(function(f){
      if(f.type === "sub") return;
      var val = v[f.k];
      if(f.type === "check" ? val === true : String(val || "").trim() !== "") n++;
    });
    var node = el("c-"+g.id);
    if(node){ node.textContent = n; node.dataset.on = n > 0 ? "1" : "0"; }
  });
}

/* ============ 偏好与草稿：只存在本机浏览器 ============ */
var saveTimer = null;
function saveDraft(v){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); }catch(e){}
  }, 400);
}
function loadDraft(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    return (obj && typeof obj === "object") ? obj : null;
  }catch(e){ return null; }
}
function readPref(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function writePref(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
}

/* ============ 主题 ============ */
function applyTheme(mode, persist){
  if(mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  if(persist) writePref(THEME_KEY, mode);
  Array.prototype.forEach.call(el("seg-theme").children, function(b){
    b.setAttribute("aria-pressed", b.dataset.themeSet === mode ? "true" : "false");
  });
}

/* ============ 语言 ============ */
function detectLang(){
  var saved = readPref(LANG_KEY);
  if(saved === "zh" || saved === "en") return saved;
  return /^zh/i.test(navigator.language || "") ? "zh" : "en";
}
function applyLang(next){
  if(next === lang) return;
  var v = readState();          /* 先取出当前填写内容 */
  lang = next;
  writePref(LANG_KEY, lang);
  buildChrome();
  buildForm();                  /* 重建表单会清空控件 */
  writeState(v, true);          /* 再把内容填回去 */
  render();
}
function updateLangButtons(){
  Array.prototype.forEach.call(el("seg-lang").children, function(b){
    b.setAttribute("aria-pressed", b.dataset.langSet === lang ? "true" : "false");
  });
}

/* ============ 复制 ============ */
function flash(btn, label){
  var node = btn.querySelector("span") || btn;
  var old = node.textContent;
  node.textContent = label;
  btn.disabled = true;
  setTimeout(function(){ node.textContent = old; btn.disabled = false; }, 1400);
}
function copyText(text, btn){
  var done = function(){ flash(btn, t("copy.done")); };
  var fallback = function(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if(ok){ done(); return; }
    }catch(e){}
    flash(btn, t("copy.manual"));
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

/* ============ 交互绑定 ============ */
function switchTab(which){
  currentTab = which;
  var isUnit = which === "unit";
  el("tab-unit").setAttribute("aria-selected", isUnit ? "true" : "false");
  el("tab-install").setAttribute("aria-selected", isUnit ? "false" : "true");
  el("pane-unit").hidden = !isUnit;
  el("pane-install").hidden = isUnit;
  el("copy-label").textContent = t("copy.idle");
}

function setSheet(open){
  var out = el("output");
  out.dataset.open = open ? "true" : "false";
  el("btn-sheet").setAttribute("aria-expanded", open ? "true" : "false");
  el("sheet-label").textContent = open ? t("sheet.hide") : t("sheet.show");
  el("backdrop").hidden = !open;
  if(open && window.innerWidth <= 940) out.scrollTop = 0;
}

function bind(){
  el("form").addEventListener("input", render);
  el("form").addEventListener("change", render);

  el("form").addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.dataset.action;
    if(action === "preset"){
      writeState(Object.assign(readState(), HARDEN_PRESET));
    } else if(action === "clear-harden"){
      var patch = {};
      HARDEN_KEYS.forEach(function(k){ patch[k] = false; });
      writeState(Object.assign(readState(), patch));
    }
  });

  el("btn-reset").addEventListener("click", function(){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    writeState(DEFAULTS);
  });

  el("seg-theme").addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-theme-set]");
    if(btn) applyTheme(btn.dataset.themeSet, true);
  });
  el("seg-lang").addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-lang-set]");
    if(btn){ applyLang(btn.dataset.langSet); updateLangButtons(); }
  });

  el("tab-unit").addEventListener("click", function(){ switchTab("unit"); });
  el("tab-install").addEventListener("click", function(){ switchTab("install"); });

  el("btn-copy").addEventListener("click", function(){
    copyText(currentTab === "unit" ? lastUnitText : lastInstallText, el("btn-copy"));
  });

  el("btn-sheet").addEventListener("click", function(){
    setSheet(el("output").dataset.open !== "true");
  });
  el("backdrop").addEventListener("click", function(){ setSheet(false); });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && el("output").dataset.open === "true") setSheet(false);
  });
}

/* ============ 启动 ============ */
lang = detectLang();
applyTheme(readPref(THEME_KEY) === "dark" || readPref(THEME_KEY) === "light" ? readPref(THEME_KEY) : "auto", false);
buildChrome();
updateLangButtons();
buildForm();
bind();
var draft = loadDraft();
writeState(draft || DEFAULTS, true);
render();
})();
</script>
